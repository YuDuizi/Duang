<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
      <title>朋友的酒生成器</title>
        <style>
            html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;}
                #app{display:flex;flex-direction:column;height:100%;}
                    #toolbar{padding:10px;display:flex;gap:8px;align-items:center;background:#1c1c1c;flex-wrap:wrap;}
                        input[type=file]{display:none;}
                            button,label{background:#333;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;}
                                button:active,label:active{background:#555;}
                                    canvas{flex:1;width:100%;display:block;touch-action:none;}
                                      </style>
                                      </head>
                                      <body>
                                      <div id="app">
                                        <div id="toolbar">
                                            <label for="file">选择图片</label>
                                                <input id="file" type="file" accept="image/*">
                                                    <button id="autoBtn">自动Duang: 关</button>
                                                        <button id="playBtn">播放BGM</button>
                                                            <button id="exportBtn">导出动图</button>
                                                              </div>
                                                                <canvas id="canvas"></canvas>
                                                                  
                                                                    <!-- 内嵌BGM。测试音频，正式使用请替换为 ./bgm.mp3 -->
                                                                      <audio id="bgm" loop crossorigin="anonymous">
                                                                          <source src="bgm.mp3" type="audio/mpeg">
                                                                            </audio>
                                                                            </div>

                                                                            <script>
                                                                            const canvas = document.getElementById('canvas');
                                                                            const ctx = canvas.getContext('2d');
                                                                            const bgm = document.getElementById('bgm');

                                                                            let img = null, imgLoaded = false;
                                                                            let drawW = 0, drawH = 0;

                                                                            // 【核心物理参数】调整这里可以改变弹跳手感
                                                                            let scaleY = 1, velY = 0, targetY = 1;// 弹性系数（越大回弹越快）
                                                                            const K = 0.05;          // 回弹变慢
                                                                            const DAMP = 0.82;       // 减少多余晃动
                                                                        // 阻尼（越小弹簧震荡越久，0.7左右为果冻感，0.9左右为干脆感）

                                                                        // 3. 在 checkBeat() 函数内（触发时的推力）
                                                                        velY = -0.35; 

                                                                            let autoDuang = false, autoTimer = null;

                                                                            // 音频相关
                                                                            let audioContext, analyser, dataArray;
                                                                            let isPlaying = false;
                                                                            let lastBeatTime = 0;
                                                                            const BEAT_THRESHOLD = 180;  // 鼓点灵敏度(0-255)，音乐低音重就调大，不弹就调小
                                                                            const MIN_BEAT_INTERVAL = 900; // 两次鼓点最小间隔(ms)，防止密集低音疯狂乱跳

                                                                            // 录制专用画布
                                                                            let recCanvas = document.createElement('canvas');
                                                                            let recCtx = recCanvas.getContext('2d');
                                                                            let isRecording = false;

                                                                            function resize(){
                                                                              const dpr = window.devicePixelRatio || 1;
                                                                                const rect = canvas.getBoundingClientRect();
                                                                                  canvas.width = rect.width * dpr;
                                                                                    canvas.height = rect.height * dpr;
                                                                                      ctx.setTransform(dpr,0,0,dpr,0,0);
                                                                                        computeDrawSize();
                                                                                        }
                                                                                        window.addEventListener('resize', resize);
                                                                                        window.addEventListener('load', resize);

                                                                                        function computeDrawSize(){
                                                                                          if(!imgLoaded) return;
                                                                                            const cw = canvas.clientWidth;
                                                                                              const ch = canvas.clientHeight;
                                                                                                const maxW = cw * 0.8;
                                                                                                  const maxH = ch * 0.8;
                                                                                                    const ratio = Math.min(maxW / img.width, maxH / img.height);
                                                                                                      drawW = img.width * ratio;
                                                                                                        drawH = img.height * ratio;
                                                                                                        }

                                                                                                        document.getElementById('file').addEventListener('change', e => {
                                                                                                          const file = e.target.files[0];
                                                                                                            if(!file) return;
                                                                                                              const reader = new FileReader();
                                                                                                                reader.onload = ev => {
                                                                                                                    const image = new Image();
                                                                                                                        image.onload = () => {
                                                                                                                              const MAX = 1024;
                                                                                                                                    let w = image.width, h = image.height;
                                                                                                                                          if(Math.max(w,h) > MAX){
                                                                                                                                                  const r = MAX / Math.max(w,h);
                                                                                                                                                          w = Math.round(w*r); h = Math.round(h*r);
                                                                                                                                                                }
                                                                                                                                                                      const off = document.createElement('canvas');
                                                                                                                                                                            off.width = w; off.height = h;
                                                                                                                                                                                  off.getContext('2d').drawImage(image,0,0,w,h);
                                                                                                                                                                                        const resized = new Image();
                                                                                                                                                                                              resized.onload = () => {
                                                                                                                                                                                                      img = resized;
                                                                                                                                                                                                              imgLoaded = true;
                                                                                                                                                                                                                      computeDrawSize();
                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                  resized.src = off.toDataURL('image/png');
                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                          image.src = ev.target.result;
                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                              reader.readAsDataURL(file);
                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                              function press(){ targetY = 0.65; }
                                                                                                                                                                                                                                              function release(){ targetY = 1.0; }

                                                                                                                                                                                                                                              canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
                                                                                                                                                                                                                                              canvas.addEventListener('pointerup', e => { e.preventDefault(); release(); });
                                                                                                                                                                                                                                              canvas.addEventListener('pointercancel', release);
                                                                                                                                                                                                                                              canvas.addEventListener('pointerleave', release);

                                                                                                                                                                                                                                              // 自动Duang按钮（纯物理冲量版，保持节奏规律）
                                                                                                                                                                                                                                              document.getElementById('autoBtn').addEventListener('click', () => {
                                                                                                                                                                                                                                                autoDuang = !autoDuang;
                                                                                                                                                                                                                                                  document.getElementById('autoBtn').textContent = '自动Duang: ' + (autoDuang?'开':'关');
                                                                                                                                                                                                                                                    if(autoDuang){
                                                                                                                                                                                                                                                        autoTimer = setInterval(() => {
                                                                                                                                                                                                                                                              velY = -0.2; // 自动模式下，每600ms推一下
                                                                                                                                                                                                                                                                  }, 600);
                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                        clearInterval(autoTimer);
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                          // 播放/暂停BGM，并启动鼓点检测
                                                                                                                                                                                                                                                                          document.getElementById('playBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                                                            if (isPlaying) {
                                                                                                                                                                                                                                                                                bgm.pause();
                                                                                                                                                                                                                                                                                    isPlaying = false;
                                                                                                                                                                                                                                                                                        document.getElementById('playBtn').textContent = '播放BGM';
                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                    // 必须在用户点击后初始化 AudioContext
                                                                                                                                                                                                                                                                                                        if (!audioContext) {
                                                                                                                                                                                                                                                                                                              audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                                                                                                                                                                                                    analyser = audioContext.createAnalyser();
                                                                                                                                                                                                                                                                                                                          analyser.fftSize = 256;
                                                                                                                                                                                                                                                                                                                                const source = audioContext.createMediaElementSource(bgm);
                                                                                                                                                                                                                                                                                                                                      source.connect(analyser);
                                                                                                                                                                                                                                                                                                                                            analyser.connect(audioContext.destination);
                                                                                                                                                                                                                                                                                                                                                  dataArray = new Uint8Array(analyser.frequencyBinCount);
                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                              await audioContext.resume();
                                                                                                                                                                                                                                                                                                                                                                  await bgm.play();
                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                          isPlaying = true;
                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('playBtn').textContent = '暂停BGM';
                                                                                                                                                                                                                                                                                                                                                                                  checkBeat();
                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                        alert('播放失败，请重试。如果是首次使用，请确保允许音频播放。');
                                                                                                                                                                                                                                                                                                                                                                                            console.error(err);
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                                                                              // 鼓点检测逻辑（改为物理冲量版：只施加向下的推力，让弹簧自己回弹）
                                                                                                                                                                                                                                                                                                                                                                                              function checkBeat() {
                                                                                                                                                                                                                                                                                                                                                                                                if (!isPlaying) return;
                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                    analyser.getByteFrequencyData(dataArray);
                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                        let lowFreqEnergy = 0;
                                                                                                                                                                                                                                                                                                                                                                                                          const LOW_FREQ_RANGE = 10; 
                                                                                                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < LOW_FREQ_RANGE; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                lowFreqEnergy += dataArray[i];
                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                    lowFreqEnergy /= LOW_FREQ_RANGE;

                                                                                                                                                                                                                                                                                                                                                                                                                      const now = Date.now();
                                                                                                                                                                                                                                                                                                                                                                                                                        if (lowFreqEnergy > BEAT_THRESHOLD && now - lastBeatTime > MIN_BEAT_INTERVAL) {
                                                                                                                                                                                                                                                                                                                                                                                                                            // 核心修改：不再设置 targetY，而是直接给一个向下的速度（推力）
                                                                                                                                                                                                                                                                                                                                                                                                                                // 推一下，弹簧会自己弹回来，完美模拟“点头”
                                                                                                                                                                                                                                                                                                                                                                                                                                    velY = -0.18; 
                                                                                                                                                                                                                                                                                                                                                                                                                                        lastBeatTime = now;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                            requestAnimationFrame(checkBeat);
                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                            // 核心渲染
                                                                                                                                                                                                                                                                                                                                                                                                                                            function animate(){
                                                                                                                                                                                                                                                                                                                                                                                                                                              if(imgLoaded){
                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 物理弹簧计算
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const force = (targetY - scaleY) * K;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          velY += force;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              velY *= DAMP;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  scaleY += velY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // 限制形变范围
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(scaleY < 0.4) scaleY = 0.4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(scaleY > 1.5) scaleY = 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // 体积守恒：高度变小，宽度变大
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const scaleX = 1 + (1 - scaleY) * 0.6;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const cw = canvas.clientWidth;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const ch = canvas.clientHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.clearRect(0,0,cw,ch);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const w = drawW * scaleX;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const h = drawH * scaleY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const x = cw/2 - w/2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const y = ch*0.9 - h;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.drawImage(img, x, y, w, h);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 录制画布同步
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (isRecording) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  recCtx.fillStyle = '#111';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        recCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const rx = (recCanvas.width - w) / 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const ry = recCanvas.height - h - 20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          recCtx.drawImage(img, rx, ry, w, h);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  requestAnimationFrame(animate);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 导出MP4逻辑
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('exportBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!imgLoaded) return alert('请先选择一张图片！');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      recCanvas.width = drawW * 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        recCanvas.height = drawH * 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          isRecording = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('exportBtn').textContent = '准备中...';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // 如果BGM没播放，用自动Duang来录制
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!isPlaying) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    autoDuang = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('autoBtn').textContent = '自动Duang: 开';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            clearInterval(autoTimer);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                autoTimer = setInterval(() => { velY = -0.2; }, 600);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let options = { mimeType: 'video/mp4;codecs=avc1' };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const stream = recCanvas.captureStream(15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let mediaRecorder;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mediaRecorder = new MediaRecorder(stream, options);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert('您的手机浏览器不支持录制，请尝试使用手机自带的“屏幕录制”功能。');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  isRecording = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let recordedChunks = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    mediaRecorder.ondataavailable = (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mediaRecorder.onstop = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (recordedChunks.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const blob = new Blob(recordedChunks, { type: options.mimeType });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const url = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const a = document.createElement('a');
