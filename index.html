<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Q弹生成器</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;}
    #app{display:flex;flex-direction:column;height:100%;}
      #toolbar{padding:10px;display:flex;gap:8px;align-items:center;background:#1c1c1c;}
        input[type=file]{display:none;}
          button,label{background:#333;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:14px;}
            canvas{flex:1;width:100%;display:block;touch-action:none;}
            </style>
            </head>
            <body>
            <div id="app">
              <div id="toolbar">
                  <label for="file">选择图片</label>
                      <input id="file" type="file" accept="image/*">
                          <button id="autoBtn">自动Duang: 关</button>
                          <button id="exportBtn">导出动图</button>
                            </div>
                              <canvas id="canvas"></canvas>
                              </div>
                              <script>
                              const canvas = document.getElementById('canvas');
                              const ctx = canvas.getContext('2d');
                              let img = null, imgLoaded = false;
                              let drawW = 0, drawH = 0;
                              let scaleY = 1, velY = 0, targetY = 1;
                              const K = 0.25, DAMP = 0.82;
                              let autoDuang = false, autoTimer = null;

                              function resize(){
                                  const dpr = window.devicePixelRatio || 1;
                                    const rect = canvas.getBoundingClientRect();
                                      canvas.width = rect.width * dpr;
                                        canvas.height = rect.height * dpr;
                                          ctx.setTransform(dpr,0,0,dpr,0,0);
                                            computeDrawSize();
                              }
                              window.addEventListener('resize', resize);
                              window.addEventListener('load', resize);

                              function computeDrawSize(){
                                  if(!imgLoaded) return;
                                    const cw = canvas.clientWidth;
                                      const ch = canvas.clientHeight;
                                        const maxW = cw * 0.8;
                                          const maxH = ch * 0.8;
                                            const ratio = Math.min(maxW / img.width, maxH / img.height);
                                              drawW = img.width * ratio;
                                                drawH = img.height * ratio;
                              }

                              document.getElementById('file').addEventListener('change', e => {
                                  const file = e.target.files[0];
                                    if(!file) return;
                                      const reader = new FileReader();
                                        reader.onload = ev => {
                                                const image = new Image();
                                                    image.onload = () => {
                                                              const MAX = 1024;
                                                                    let w = image.width, h = image.height;
                                                                          if(Math.max(w,h) > MAX){
                                                                                    const r = MAX / Math.max(w,h);
                                                                                            w = Math.round(w*r); h = Math.round(h*r);
                                                                                                  }
                                                                                                        const off = document.createElement('canvas');
                                                                                                              off.width = w; off.height = h;
                                                                                                                    off.getContext('2d').drawImage(image,0,0,w,h);
                                                                                                                          const resized = new Image();
                                                                                                                                resized.onload = () => {
                                                                                                                                            img = resized;
                                                                                                                                                    imgLoaded = true;
                                                                                                                                                            computeDrawSize();
                                                                                                                                                                  };
                                                                                                                                                                        resized.src = off.toDataURL('image/png');
                                                                                                                                                                            };
                                                                                                                                                                                image.src = ev.target.result;
                                                                                                                                                                                  };
                                                                                                                                                                                    reader.readAsDataURL(file);
                                                                                                                                                                                    });

                                                                                                                                                                                    function press(){ targetY = 0.65; }
                                                                                                                                                                                    function release(){ targetY = 1.0; }

                                                                                                                                                                                    canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
                                                                                                                                                                                    canvas.addEventListener('pointerup', e => { e.preventDefault(); release(); });
                                                                                                                                                                                    canvas.addEventListener('pointercancel', release);
                                                                                                                                                                                    canvas.addEventListener('pointerleave', release);

                                                                                                                                                                                    document.getElementById('autoBtn').addEventListener('click', () => {
                                                                                                                                                                                          autoDuang = !autoDuang;
                                                                                                                                                                                            document.getElementById('autoBtn').textContent = '自动Duang: ' + (autoDuang?'开':'关');
                                                                                                                                                                                              if(autoDuang){
                                                                                                                                                                                                    autoTimer = setInterval(() => {
                                                                                                                                                                                                              targetY = 0.65;
                                                                                                                                                                                                                    setTimeout(() => { targetY = 1.0; }, 120);
                                                                                                                                                                                                                        }, 900);
                                                                                                                                                                                                                          } else {
                                                                                                                                                                                                                                clearInterval(autoTimer);
                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                  function animate(){
                                                                                                                                                                                                                                      if(imgLoaded){
                                                                                                                                                                                                                                            const force = (targetY - scaleY) * K;
                                                                                                                                                                                                                                                velY += force;
                                                                                                                                                                                                                                                    velY *= DAMP;
                                                                                                                                                                                                                                                        scaleY += velY;
                                                                                                                                                                                                                                                            if(scaleY < 0.4) scaleY = 0.4;
                                                                                                                                                                                                                                                                if(scaleY > 1.5) scaleY = 1.5;
                                                                                                                                                                                                                                                                    const scaleX = 1 + (1 - scaleY) * 0.6;

                                                                                                                                                                                                                                                                        const cw = canvas.clientWidth;
                                                                                                                                                                                                                                                                            const ch = canvas.clientHeight;
                                                                                                                                                                                                                                                                                ctx.clearRect(0,0,cw,ch);

                                                                                                                                                                                                                                                                                    const w = drawW * scaleX;
                                                                                                                                                                                                                                                                                        const h = drawH * scaleY;
                                                                                                                                                                                                                                                                                            const x = cw/2 - w/2;
                                                                                                                                                                                                                                                                                                const y = ch*0.9 - h;
                                                                                                                                                                                                                                                                                                    ctx.drawImage(img, x, y, w, h);
                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                        requestAnimationFrame(animate);
                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                  // ================= 新增：自动规律弹跳 + 导出逻辑 =================

                                                                                                                                                                                                                                  // 1. 点击“导出动图”按钮的逻辑
                                                                                                                                                                                                                                  document.getElementById('exportBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                    if (!imgLoaded) return alert('请先选择一张图片！');

                                                                                                                                                                                                                                      // 强制打开自动Duang
                                                                                                                                                                                                                                        autoDuang = true;
                                                                                                                                                                                                                                          document.getElementById('autoBtn').textContent = '自动Duang: 开';
                                                                                                                                                                                                                                            clearInterval(autoTimer);
                                                                                                                                                                                                                                              // 让它以规律的节奏弹跳 (每500毫秒压扁一次)
                                                                                                                                                                                                                                                autoTimer = setInterval(() => {
                                                                                                                                                                                                                                                    targetY = 0.65;
                                                                                                                                                                                                                                                        setTimeout(() => { targetY = 1.0; }, 150);
                                                                                                                                                                                                                                                          }, 600);

                                                                                                                                                                                                                                                            // 准备录制
                                                                                                                                                                                                                                                              const stream = canvas.captureStream(30); // 30帧每秒
                                                                                                                                                                                                                                                                // 兼容安卓 Chrome 和 iOS Safari
                                                                                                                                                                                                                                                                  let options = { mimeType: 'video/webm' }; 
                                                                                                                                                                                                                                                                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                                                                                                                                                                                                                                                                        options = { mimeType: 'video/mp4' }; 
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                              let recordedChunks = [];
                                                                                                                                                                                                                                                                                const mediaRecorder = new MediaRecorder(stream, options);

                                                                                                                                                                                                                                                                                  mediaRecorder.ondataavailable = (e) => {
                                                                                                                                                                                                                                                                                      if (e.data.size > 0) recordedChunks.push(e.data);
                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                          mediaRecorder.onstop = () => {
                                                                                                                                                                                                                                                                                              const blob = new Blob(recordedChunks, { type: options.mimeType });
                                                                                                                                                                                                                                                                                                  const url = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                      const a = document.createElement('a');
                                                                                                                                                                                                                                                                                                          a.href = url;
                                                                                                                                                                                                                                                                                                              // 自动下载文件
                                                                                                                                                                                                                                                                                                                  a.download = 'Q弹动画_' + Date.now() + (options.mimeType.includes('mp4') ? '.mp4' : '.webm');
                                                                                                                                                                                                                                                                                                                      document.body.appendChild(a);
                                                                                                                                                                                                                                                                                                                          a.click();
                                                                                                                                                                                                                                                                                                                              document.body.removeChild(a);
                                                                                                                                                                                                                                                                                                                                  URL.revokeObjectURL(url);
                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                          // 录制完关闭自动弹跳
                                                                                                                                                                                                                                                                                                                                              autoDuang = false;
                                                                                                                                                                                                                                                                                                                                                  document.getElementById('autoBtn').textContent = '自动Duang: 关';
                                                                                                                                                                                                                                                                                                                                                      clearInterval(autoTimer);
                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                          // 开始录制，录制 3 秒后自动停止
                                                                                                                                                                                                                                                                                                                                                            mediaRecorder.start();
                                                                                                                                                                                                                                                                                                                                                              document.getElementById('exportBtn').textContent = '录制中...';
                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                  setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                      mediaRecorder.stop();
                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('exportBtn').textContent = '导出动图';
                                                                                                                                                                                                                                                                                                                                                                            }, 3000); // 3秒长度，足够了
                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                  resize();
                                                                                                                                                                                                                                  animate();
                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                  </html>
                                                                                                                                                                                                                                      }
                              }
