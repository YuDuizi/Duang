<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
      <title>朋友的酒生成器</title>
        <style>
            html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;}
                #app{display:flex;flex-direction:column;height:100%;}
                    #toolbar{padding:10px;display:flex;gap:8px;align-items:center;background:#1c1c1c;flex-wrap:wrap;}
                        input[type=file]{display:none;}
                            button,label{background:#333;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;}
                                button:active,label:active{background:#555;}
                                    /* 时长输入框样式 */
                                        input[type=number]{width: 50px; padding: 8px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 14px;}
                                            canvas{flex:1;width:100%;display:block;touch-action:none;}
                                             </style>
                                              </head>
                                              <body>
                                              <div id="app">
                                                <div id="toolbar">
                                                    <label for="file">选择图片</label>
                                                        <input id="file" type="file" accept="image/*">
                                                            <button id="autoBtn">自动Duang: 关</button>
                                                                <button id="playBtn">播放BGM</button>
                                                                    <label for="durationInput" style="font-size:14px;">时长(秒):</label>
                                                                        <input id="durationInput" type="number" value="5" min="5" max="15">
                                                                            <button id="exportBtn">导出动图</button>
                                                                              </div>
                                                                              <!-- GIF 装饰层 -->
                                                                              <div id="gif-layer">
                                                                                <!-- 这里放你的 GIF，src 写文件名，用 style 控制位置和大小 -->
                                                                                  <img class="deco-gif" src="./1.gif" style="top: 10%; left: 50%; height: 65px;">
                                                                                    <img class="deco-gif" src="./2.gif" style="top: 25%; left: 15%; height: 65px;">
                                                                                     <img class="deco-gif" src="./3.gif" style="top: 35%; right: 15%; height: 65px;">
                                                                                      <img class="deco-gif" src="./4.gif" style="top: 5%; right: 5%; width: 65px;">
                                                                                      
</div>

<canvas id="canvas"></canvas>
                                                                                      </div>
                                                                                      
                                                                                      <canvas id="canvas"></canvas>
                                                                      
                                                                                  
                                                                                    <!-- 你的本地 BGM -->
                                                                                      <audio id="bgm" loop crossorigin="anonymous">
                                                                                          <source src="./bgm.mp3" type="audio/mpeg">
                                                                                              您的浏览器不支持音频播放。
                                                                                                </audio>
                                                                                                </div>

                                                                                                <script>
                                                                                                const canvas = document.getElementById('canvas');
                                                                                                const ctx = canvas.getContext('2d');
                                                                                                const bgm = document.getElementById('bgm');

                                                                                                let img = null, imgLoaded = false;
                                                                                                let drawW = 0, drawH = 0;

                                                                                                // 【核心物理参数】专门为 130 BPM DJ曲调优：干脆、有力、隔拍跳
                                                                                                let scaleY = 1, velY = 0, targetY = 1;
                                                                                                const K = 0.05;       // 弹力拉满，猛地弹回原位
                                                                                                const DAMP = 0.85;   // 阻尼加大，一次回弹立刻静止，不晃悠

                                                                                                let autoDuang = false, autoTimer = null;

                                                                                                // 音频相关
                                                                                                let audioContext, analyser, dataArray;
                                                                                                let isPlaying = false;
                                                                                                let lastBeatTime = 0;
                                                                                                const BEAT_THRESHOLD = 190;  // 鼓点灵敏度（越大越不敏感）
                                                                                                const MIN_BEAT_INTERVAL = 400; // 【核心】听1拍休1拍，130BPM下约为900ms

                                                                                                // 录制专用画布
                                                                                                let recCanvas = document.createElement('canvas');
                                                                                                let recCtx = recCanvas.getContext('2d');
                                                                                                let isRecording = false;

                                                                                                function resize(){
                                                                                                  const dpr = window.devicePixelRatio || 1;
                                                                                                    const rect = canvas.getBoundingClientRect();
                                                                                                      canvas.width = rect.width * dpr;
                                                                                                        canvas.height = rect.height * dpr;
                                                                                                          ctx.setTransform(dpr,0,0,dpr,0,0);
                                                                                                            computeDrawSize();
                                                                                                            }
                                                                                                            window.addEventListener('resize', resize);
                                                                                                            window.addEventListener('load', resize);

                                                                                                            function computeDrawSize(){
                                                                                                              if(!imgLoaded) return;
                                                                                                                const cw = canvas.clientWidth;
                                                                                                                  const ch = canvas.clientHeight;
                                                                                                                    const maxW = cw * 0.8;
                                                                                                                      const maxH = ch * 0.8;
                                                                                                                        const ratio = Math.min(maxW / img.width, maxH / img.height);
                                                                                                                          drawW = img.width * ratio;
                                                                                                                            drawH = img.height * ratio;
                                                                                                                            }

                                                                                                                            document.getElementById('file').addEventListener('change', e => {
                                                                                                                              const file = e.target.files[0];
                                                                                                                                if(!file) return;
                                                                                                                                  const reader = new FileReader();
                                                                                                                                    reader.onload = ev => {
                                                                                                                                        const image = new Image();
                                                                                                                                            image.onload = () => {
                                                                                                                                                  const MAX = 1024;
                                                                                                                                                        let w = image.width, h = image.height;
                                                                                                                                                              if(Math.max(w,h) > MAX){
                                                                                                                                                                      const r = MAX / Math.max(w,h);
                                                                                                                                                                              w = Math.round(w*r); h = Math.round(h*r);
                                                                                                                                                                                    }
                                                                                                                                                                                          const off = document.createElement('canvas');
                                                                                                                                                                                                off.width = w; off.height = h;
                                                                                                                                                                                                      off.getContext('2d').drawImage(image,0,0,w,h);
                                                                                                                                                                                                            const resized = new Image();
                                                                                                                                                                                                                  resized.onload = () => {
                                                                                                                                                                                                                          img = resized;
                                                                                                                                                                                                                                  imgLoaded = true;
                                                                                                                                                                                                                                          computeDrawSize();
                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                      resized.src = off.toDataURL('image/png');
                                                                                                                                                                                                                                                          };
                                                                                                                                                                                                                                                              image.src = ev.target.result;
                                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                                  reader.readAsDataURL(file);
                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                  function press(){ targetY = 0.65; }
                                                                                                                                                                                                                                                                  function release(){ targetY = 1.0; }

                                                                                                                                                                                                                                                                  // 【防触摸锁死】改用全局监听，防止手指滑出屏幕导致页面卡死
                                                                                                                                                                                                                                                                  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
                                                                                                                                                                                                                                                                  window.addEventListener('pointerup', release);
                                                                                                                                                                                                                                                                  window.addEventListener('pointercancel', release);
                                                                                                                                                                                                                                                                  canvas.addEventListener('touchstart', e => { e.preventDefault(); press(); }, {passive: false});
                                                                                                                                                                                                                                                                  window.addEventListener('touchend', release);

                                                                                                                                                                                                                                                                  // 自动Duang按钮（纯物理冲量版，保持节奏规律）
                                                                                                                                                                                                                                                                  document.getElementById('autoBtn').addEventListener('click', () => {
                                                                                                                                                                                                                                                                    autoDuang = !autoDuang;
                                                                                                                                                                                                                                                                      document.getElementById('autoBtn').textContent = '自动Duang: ' + (autoDuang?'开':'关');
                                                                                                                                                                                                                                                                        if(autoDuang){
                                                                                                                                                                                                                                                                            autoTimer = setInterval(() => {
                                                                                                                                                                                                                                                                                  velY = -0.35; // 强力下压
                                                                                                                                                                                                                                                                                      }, 900); // 900ms一次，与鼓点保持一致的频率
                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                            clearInterval(autoTimer);
                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                              // 【稳健版】播放/暂停BGM，并启动鼓点检测
                                                                                                                                                                                                                                                                                              document.getElementById('playBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                if (isPlaying) {
                                                                                                                                                                                                                                                                                                    bgm.pause();
                                                                                                                                                                                                                                                                                                        isPlaying = false;
                                                                                                                                                                                                                                                                                                            document.getElementById('playBtn').textContent = '播放BGM';
                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                        // 必须在用户点击时创建或唤醒 AudioContext
                                                                                                                                                                                                                                                                                                                            if (!audioContext) {
                                                                                                                                                                                                                                                                                                                                  audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                          if (audioContext.state === 'suspended') {
                                                                                                                                                                                                                                                                                                                                                await audioContext.resume();
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                        // 重新绑定音频节点
                                                                                                                                                                                                                                                                                                                                                            analyser = audioContext.createAnalyser();
                                                                                                                                                                                                                                                                                                                                                                analyser.fftSize = 256;
                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                        // 防止重复绑定报错，只绑定一次
                                                                                                                                                                                                                                                                                                                                                                            if (!window.hasBoundAudio) {
                                                                                                                                                                                                                                                                                                                                                                                  const source = audioContext.createMediaElementSource(bgm);
                                                                                                                                                                                                                                                                                                                                                                                        source.connect(analyser);
                                                                                                                                                                                                                                                                                                                                                                                              analyser.connect(audioContext.destination);
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                          // 用于录制
                                                                                                                                                                                                                                                                                                                                                                                                                window.mediaStreamDest = audioContext.createMediaStreamDestination();
                                                                                                                                                                                                                                                                                                                                                                                                                      source.connect(window.mediaStreamDest);
                                                                                                                                                                                                                                                                                                                                                                                                                            window.hasBoundAudio = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                        dataArray = new Uint8Array(analyser.frequencyBinCount);

                                                                                                                                                                                                                                                                                                                                                                                                                                            await bgm.play();
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                    isPlaying = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('playBtn').textContent = '暂停BGM';
                                                                                                                                                                                                                                                                                                                                                                                                                                                            checkBeat();
                                                                                                                                                                                                                                                                                                                                                                                                                                                              } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  alert('播放失败，请检查 bgm.mp3 是否在根目录，或是否被浏览器拦截。错误：' + err.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.error(err);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 鼓点检测逻辑（物理冲量版：只施加向下的推力，让弹簧自己回弹）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function checkBeat() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!isPlaying) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              analyser.getByteFrequencyData(dataArray);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let lowFreqEnergy = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const LOW_FREQ_RANGE = 10; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for (let i = 0; i < LOW_FREQ_RANGE; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          lowFreqEnergy += dataArray[i];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              lowFreqEnergy /= LOW_FREQ_RANGE;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const now = Date.now();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (lowFreqEnergy > BEAT_THRESHOLD && now - lastBeatTime > MIN_BEAT_INTERVAL) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // 核心：给一个向下的速度（推力），让弹簧自己弹回来
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          velY = -0.35; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              lastBeatTime = now;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  requestAnimationFrame(checkBeat);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 核心渲染
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function animate(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(imgLoaded){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 物理弹簧计算
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const force = (targetY - scaleY) * K;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                velY += force;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    velY *= DAMP;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        scaleY += velY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // 限制形变范围
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(scaleY < 0.4) scaleY = 0.4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(scaleY > 1.5) scaleY = 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // 体积守恒：高度变小，宽度变大
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const scaleX = 1 + (1 - scaleY) * 0.6;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const cw = canvas.clientWidth;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const ch = canvas.clientHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.clearRect(0,0,cw,ch);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const w = drawW * scaleX;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const h = drawH * scaleY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const x = cw/2 - w/2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const y = ch*0.9 - h;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.drawImage(img, x, y, w, h);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 录制画布同步（去黑边）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (isRecording) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        recCtx.fillStyle = '#111';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              recCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const rx = (recCanvas.width - w) / 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const ry = recCanvas.height - h - 20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recCtx.drawImage(img, rx, ry, w, h);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        requestAnimationFrame(animate);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 导出MP4逻辑（支持自定义时长 + 合并音频）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('exportBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!imgLoaded) return alert('请先选择一张图片！');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 1. 获取用户设定的时长
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let durationInput = document.getElementById('durationInput');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let durationSec = parseInt(durationInput.value) || 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const MAX_DURATION = 15; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const MIN_DURATION = 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (durationSec > MAX_DURATION) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            durationSec = MAX_DURATION;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                durationInput.value = MAX_DURATION;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert(`最长只能录制 ${MAX_DURATION} 秒哦，防止手机卡死！`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (durationSec < MIN_DURATION) {
